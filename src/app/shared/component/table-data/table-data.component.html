<section>
    <div class="row">
        <div [ngClass]="{'col-md-10': addNew.status, 'col-12': !addNew.status}">
            <div class="input-group p-1 hidden-print">
                <input
                type="icon"
                class="form-control"
                placeholder="Buscar..."
                [patterns] ="customPatterns"
                mask="A*"
                [value]="sortByService.search"
                #txtSearch (keyup)="search(txtSearch.value);"
                >
                <div class="input-group-append">
                    <span class="input-group-icon" id="basic-addon2"><i class="mdi mdi-magnify"></i></span>
                </div>
            </div>
        </div>
        <div class="col-md-2 justify-content-center align-self-end p-0 m-0" *ngIf="addNew.status">
          <a class="p-0 m-0 d-flex justify-content-start align-items-center" >
              <i class="mdi mdi-plus-circle-outline h2 icon-success"></i>
              <p class=" colorTextPrimari h4 p-0 m-0"> {{ addNew.title }} </p>
          </a>
        </div>
    </div>

    <div class="col-12 table-responsive mt-3 ">

        <table class="table table-hover">
            <thead>
                <tr>
                  <th *ngFor="let title of titles; let id = index" class="head-table thd-{{id}}">
                      <div>
                          <div class="head-table-text">
                              <p>{{title.title}}</p>
                          </div>
                          <div class="head-table-icon">
                              <div class="container-icon-up" (click)="sortByService.dataSortBy0(title.key, $event)">
                                  <a class="icon-up"><i class="mdi mdi-chevron-up"></i></a>
                              </div>
                              <div class="container-icon-down" (click)="sortByService.dataSortBy1(title.key, $event)">
                                  <a class="icon-down"><i class="mdi mdi-chevron-down"></i></a>
                              </div>
                          </div>
                      </div>
                  </th>
                  <th class="head-table" *ngIf="options">
                      <div>
                          <div class="head-table-text">
                              <p class="pb-1">Opciones</p>
                          </div>
                      </div>
                  </th>
                </tr>
            </thead>
            <tbody class="tbody">
                <ng-container *ngFor="let data of dataInput | sortBy:sortByService.dataSort:sortByService.order | filter:sortByService.search:sortByService.page:titles:this.dataForPage let id = index "
                >
                    <tr class="tb-{{id}}">

                        <td *ngFor="let title of titles; let i = index"
                        class="tdd-{{i}}"
                        >

                            <div class="d-flex align-items-stretch justify-content-center"
                            *ngIf="title?.title != 'Memorandos asociados'"
                            >
                                <ng-container [ngSwitch]="title?.title">

                                    <ng-container *ngSwitchCase="'Nro.'">
                                        <div class="checkbox d-flex align-items-center">

                                          <i
                                          class="color-secondary fs-4 mdi "
                                          [ngClass]="{'mdi-plus': !data.hidden, 'mdi-minus': data.hidden}"
                                          [title]= "!data.hidden ? 'Ver los datos ocultos': 'Ocultar los datos'"
                                          (click)="viewDetail($event, data['Nro.'])"
                                          ></i>

                                          <!-- <input
                                          class=" mx-2"
                                          type="checkbox" name=""
                                          title="Ver los datos ocultos"
                                          [checked]="data.hidden"
                                          (click)="viewDetail($event, data['Nro.'])"
                                          > -->
                                        </div>
                                        <p class="colorTextPrimari ">{{ data[title.key] }}</p>

                                    </ng-container>

                                    <ng-container *ngSwitchCase="'fecha'">
                                        <span class="colorTextPrimari">{{ data[title.key] | date:'dd/MM/YYYY' }}</span>
                                    </ng-container>

                                    <ng-container *ngSwitchDefault>
                                        <span class="colorTextPrimari">{{ data[title.key] }}</span>
                                    </ng-container>

                                </ng-container>

                            </div>
                        </td>

                        <td *ngIf="actionsTable.length != 0">

                            <!-- <a *ngIf="actionsTable.includes('ar') && data.estatus === 'Por Asignar' "><i title = "Asignar solicitud" class="mdi mdi-account-plus h3 icon-primary-color mx-1" (click)="assignRequest($event, data['Nro. solicitud'])"></i></a>

                            <a *ngIf="actionsTable.includes('rar') && data.estatus === 'Asignada'"><i title = "Reasignar solicitud" class="mdi mdi-account-switch h3 icon-primary-color mx-1" (click)="assignRequest($event, data['Nro. solicitud'])"></i></a>

                            <a *ngIf="actionsTable.includes('vr')"><i title = "Ver solicitud" class="mdi mdi-eye h3 icon-primary-color mx-1" (click)="viewRequest($event, data['Nro. solicitud'])"></i></a>

                            <a *ngIf="actionsTable.includes('es')"><i title = "Editar solicitud" class="mdi mdi-pencil-outline h3 icon-primary-color mx-1" (click)="editRequest($event, data['Nro. solicitud'])"></i></a>



                            <a *ngIf="actionsTable.includes('nm')"><i title = "Nuevo memorando" class="mdi mdi-paperclip h3 icon-primary-color mx-1" (click)="processRequest($event, data.NumberInput)"></i></a>

                            <a *ngIf="actionsTable.includes('ec')"><i title = "Editar ciudadano" class="mdi mdi-pencil-outline h3 icon-primary-color mx-1" (click)="editCitizen($event, (data.nac +'-'+ data.ced))"></i></a>

                            <a *ngIf="actionsTable.includes('er')"><i title = "Eliminar registro" class="mdi mdi-close h3 icon-primary-color mx-1" (click)="removeCitizen($event, id)"></i></a>

                            <a *ngIf="actionsTable.includes('em')"><i title = "Ver memorando" class="mdi mdi-file-pdf-box h3 icon-primary-color mx-1" (click)="viewMemo($event, data.NumberMemo)"></i></a>

                            <a *ngIf="actionsTable.includes('em')"><i title = "Editar Memorando" class="mdi mdi-pencil-outline h3 icon-primary-color mx-1" (click)="editarMemo($event, data.NumberMemo)"></i></a>

                            <a *ngIf="actionsTable.includes('vc')"><i title = "Ver Correcciones" class="mdi mdi-comment-text-outline h3 icon-primary-color mx-1" (click)="viewCorrections($event, data.corrections)"></i></a>




                            <a *ngIf="actionsTable.includes('enr')"><i title = "Editar nota de remisión" class="mdi mdi-pencil-outline h3 icon-primary-color mx-1" (click)="editRemissionNote($event, 12)"></i></a>

                            <a *ngIf="actionsTable.includes('vnr')"><i title = "Ver nota de remisión" class="mdi mdi-eye h3 icon-primary-color mx-1" (click)="viewRemissionNote($event, 12)"></i></a>

                            <a *ngIf="actionsTable.includes('evnr')"><i title = "Enviar nota de remisión" class="mdi mdi-send h3 icon-primary-color mx-1" (click)="sendRemissionNote($event, 12)"></i></a>



                            <a *ngIf="actionsTable.includes('dce')"><i title = "Descargar constancia de entrega" class="mdi mdi-file-pdf-box h3 icon-primary-color mx-1" (click)="downloadConstancyDelivery($event, 12)"></i></a>

                            <a *ngIf="actionsTable.includes('vce')"><i title = "Ver constancia de entrega" class="mdi mdi-eye h3 icon-primary-color mx-1" (click)="viewConstancyDelivery($event, 12)"></i></a>

                            <a *ngIf="actionsTable.includes('evce')"><i title = "Enviar constancia de entrega" class="mdi mdi-send h3 icon-primary-color mx-1" (click)="sendConstancyDelivery($event, 12)"></i></a> -->

                            <a *ngIf="actionsTable.includes('daps')" [href]="data.path" ><i title = "Descargar lista APS" class="color-secondary mdi mdi-download-circle-outline h3 icon-primary-color mx-1" ></i></a>

                        </td>


                    </tr>

                    <tr
                    class="hidden-data hidden-print" [hidden]="!data.hidden">

                        <td class="data-td " colspan="4">
                            <ng-container *ngFor="let title of titles; let i2 = index">
                                <ul class="d-{{i2}}">
                                    <p id="i-{{i2}}" class="title">{{title.title}}:</p>
                                    <p
                                    class="value"
                                    [ngClass]="{'text-status-red': (data[title.key] === 'Por Asignar') || (data[title.key] === 'corrección'), 'text-status-orange': (data[title.key] === 'Asignada'), 'text-status-green': (data[title.key] === 'APROBADO')}"
                                    >{{data[title.key]}}</p>
                                </ul>
                            </ng-container>
                        </td>

                    </tr>

                </ng-container>

            </tbody>
        </table>
        <hr class="m-0 mb-1">
        <div class="button-navigate hidden-print" *ngIf=" pages.length > 1 ">
            <div  class="btn-content d-flex justify-content-start align-items-center flex-nowrap">

                <div class="btn-move m-0 p-0">
                    <button class="btn btn-outline-primary style-outline"  (click)="sortByService.getPage(1); getPages();" [disabled]="sortByService.page === 0" title="ir al inicio"><i class="mdi mdi-chevron-double-left"></i></button>

                    <button class="btn btn-outline-primary style-outline" (click)="sortByService.prevPage($event, dataForPage); getPages();" [disabled]="sortByService.page === 0" title="Anterior"><i class="mdi mdi-arrow-left-bold"></i> <span class="btn-text">Anterior</span>  </button>
                </div>

                <div class="d-flex flex-wrap align-items-center justify-content-center btn-list">
                  <ng-container *ngFor="let page of pages">
                    <button class="btn btn-outline-primary style-outline"  *ngIf="(page.pageNumber === (pages.length - 1)) && (page.hidden === true)" disabled>...</button>

                    <button class="btn" [ngClass]="{'btn-primary style' : page.active === true, 'btn-outline-primary style-outline' : page.active != true}" *ngIf="!page.hidden || (page.pageNumber === pages.length) || (page.pageNumber === 1 )" (click)="sortByService.getPage(page.pageNumber); getPages();">{{ page.pageNumber }}</button>

                    <button class="btn btn-outline-primary style-outline" *ngIf="(page.pageNumber === 2) && (page.hidden === true)" disabled>...</button>
                    </ng-container>
                </div>

                <div class="btn-move m-0 p-0">
                    <button class="btn btn-outline-primary style-outline" (click)="sortByService.nextPage($event, dataForPage); getPages();" [disabled]="sortByService.finishPage(pages.length)" title="Siguiente"><span class="btn-text">Siguiente</span>  <i class="mdi mdi-arrow-right-bold"></i></button>

                    <button class="btn btn-outline-primary style-outline"  (click)="sortByService.getPage(pages.length); getPages();" [disabled]="sortByService.finishPage(pages.length)" title="Ir al final"><i class="mdi mdi-chevron-double-right"></i></button>
                </div>

            </div>
        </div>
    </div>

</section>
