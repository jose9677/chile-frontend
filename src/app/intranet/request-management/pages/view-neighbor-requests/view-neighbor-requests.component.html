<div class="row card">
  <div class="col-md-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h6 class="card-title">Tus Solicitudes</h6>
        <div class="table-responsive">
          <div class="dataTable-search">
            <input type="text" placeholder="Buscar..." #txtSearch (keyup)="sortByService.onSearch(txtSearch.value)">
            <i class="mdi mdi-magnify"></i>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th (click)="sortByService.dataSortBy('nroRequest')">Nro. Solicitud</th>
                <th (click)="sortByService.dataSortBy('requestDate')">Fecha Solicitud</th>
                <th (click)="sortByService.dataSortBy('fonasa')">Tipo de Prevencion</th>
                <th (click)="sortByService.dataSortBy('dateOfVisit')">Fecha de Visita</th>
                <th (click)="sortByService.dataSortBy('visitor')">Asistente Social</th>
                <th (click)="sortByService.dataSortBy('status')">Estatus</th>
                <th >Opciones</th>
              </tr>
            </thead>
            <tbody>
                  <!-- <tr *ngFor="let request of unassignedRequest; index as i " > -->
                <tr *ngFor="let request of unassignedRequest | filter:sortByService.search:sortByService.page | sortBy:sortByService.dataSort:sortByService.order" >
                  <td >{{request.id }}</td>
                  <td>{{request.created_at}}</td>
                  <td>Tipo de Prevencion + detalle </td>
                  <td>{{request.request_date}}</td>
                  <td>{{request.visitor}}</td>
                  <td>{{request.status}}</td>
                  <td>
                    <button (click)="viewDate(request.id)" ><i class="mdi mdi-eye"></i></button>
                    <button (click)="confirmDate(request.id)" ><i class="mdi mdi-calendar-check"></i></button>
                  </td>
                </tr>
            </tbody>
            <tfoot>
              <tr>
                <th>
                  <button (click)="createDate()" ><i class="mdi mdi-calendar-plus"></i></button>
                  <!-- Necesito pasar el rut en la funcion -->
                </th>
                <th>
                  <button (click)="sortByService.prevPage()" [disabled]="sortByService.page === 0"><i class="mdi mdi-arrow-left-bold"></i></button>
                  <button (click)="sortByService.nextPage()"  [disabled]="(unassignedRequest | filter:sortByService.search:sortByService.page).length === 0" ><i class="mdi mdi-arrow-right-bold"></i></button>

                </th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
