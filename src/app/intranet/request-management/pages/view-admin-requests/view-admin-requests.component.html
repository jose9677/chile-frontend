<div class="row">
    <div class="col-md-12">
        <div class="card header p-3">
            <h2>Solicitudes</h2>
        </div>
    </div>
</div>
<br>
<div class="card p-3">
    <div class="row d-flex justify-content-center">
        <div class="col-md-4">
            <div class="card resumebox p-3 mb-2 text-center">
                <h3>Solicitudes Generadas:<br>{{countSolicitudes}}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card resumebox p-3 mb-2 text-center">
                <h3>Solicitudes Aprobadas:<br>{{approveRequest}}</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card resumebox p-3 mb-2 text-center">
                <h3>Solicitudes Rechazadas:<br>{{rejectRequest}}</h3>
            </div>
        </div>
    </div>
    <div class="row d-flex justify-content-end">
        <div class="col-md-3">
        <button  class="btn btn-primary me-2 mb-2 mb-md-0 style" type="button" (click)="getAllRequest()" >Recargar Estadísticas</button>
        </div>
    </div>
</div>
<br>
<div class="row">
    <div class="col-md-12">
        <div class="card stretch-card">
            <div class="card-body">
              <h3 class="colorTextPrimari pb-3">Resumen de Solicitudes</h3>

              <app-table-data
              [titlesTable]= "titleDataTable"
              [dataInput]= "allRequest"
              [addNew]= "{'status': false, title: ''}"
              [options] = true
              [actionsTable]= "['vd']"
              [dataForPage]="10"
              (tableActionsEvent)="tableAction($event)"
              ></app-table-data>

            </div>
        </div>
    </div>
</div>
