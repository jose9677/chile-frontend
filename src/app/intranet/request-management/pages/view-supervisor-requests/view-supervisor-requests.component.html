<div class="row">
  <div class="col-md-12">
      <div class="card header p-3">
          <h2>Solicitudes</h2>
      </div>
  </div>
</div>
<br>

<div class="row pb-3">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <h3 class="colorTextPrimari pb-3">Solicitudes sin Asignar</h3>
        <app-table-data
        [titlesTable]= "titleDataTable"
        [dataInput]= "allRequestUnassigned"
        [addNew]= "{'status': false, title: ''}"
        [options] = true
        [actionsTable]= "['vd', 'av']"
        [dataForPage]="10"
        (tableActionsEvent)="tableAction($event)"
        ></app-table-data>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <h3 class="colorTextPrimari pb-3">Solicitudes Asignadas</h3>
        <app-table-data
        [titlesTable]= "titleDataTable2"
        [dataInput]= "allRequestAssigned"
        [addNew]= "{'status': false, title: ''}"
        [options] = true
        [actionsTable]= "['vd', 'ev']"
        [dataForPage]="10"
        (tableActionsEvent)="tableAction($event)"
        ></app-table-data>
        
      </div>
    </div>
  </div>
</div>
