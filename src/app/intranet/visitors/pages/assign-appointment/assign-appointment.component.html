<div class="row h3" style="background-color:var(--backgroundColo) ;">

 </div>
 <div class="card mt-4 pb-4">
  <form class="forms-sample container">
    <div class="row mt-5">
      <div class="col-md-4 col-sm-12 text-center">
        <h3 class="colorTextPrimari">Datos de la Solicitud</h3>
      </div>
      <div class="row mt-3 text-center">
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Número de Solicitud</label>
          <div class="d-flex justify-content-center">

          </div>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Fecha de Solicitud</label>
          <div class="d-flex justify-content-center">
            <input type="date" value="2020-07-31" disabled class="form-control ms-1 mt-2 w-75">
          </div>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Estatus</label>

            <input type="text" value="Por Asignar" disabled class="form-control ms-1 mt-2 w-75">
          </div>
        </div>
      </div>
      <div class="row mt-3 text-center">
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Solicitante</label>
          <div class="d-flex justify-content-center">
            <input type="text" value="Pedro Perez" disabled class="form-control ms-1 mt-2 w-75">
          </div>
        </div>
        <div class="col-md-8 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Dirección</label>
          <div class="d-flex justify-content-center">
            <input type="text" value="Calle de ejemplo, Nro. 1234, Casa Doña Carmen" disabled class="form-control ms-1 mt-2 w-75">
          </div>
        </div>
      </div>
      <div class="row mt-3 text-center">
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Visitador</label>
          <div class="d-flex justify-content-center">
            <select class="form-select form-control ms-1 mt-2 w-75" disabled>
              <option value="">Seleccione un Visitador</option>
            </select>
          </div>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Fecha de Visita</label>
          <div class="d-flex justify-content-center">
            <input type="date"  class="form-control ms-1 mt-2 w-75">
          </div>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari size">Hora de Visita</label>
          <div class="d-flex justify-content-center">
            <input type="time"  class="form-control ms-1 mt-2 w-75">
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-4 col-sm-12 text-center">
        <h3 class="colorTextPrimari">Documentos</h3>
      </div>
      <div class="row mt-3 text-center ms-1">
        <div class="col-md-6 col-sm-12">
          <div class="row d-flex justify-content-center">
            <div class="col-md-2 col-sm-12 d-flex justify-content-center">
              <label for="Rut" class="form-label colorTextPrimari size">Tipo de Prevención</label>
            </div>
            <div class="col-md-7 col-sm-12 d-flex justify-content-center">

        <div class="col-md-4 col-sm-12 d-flex justify-content-center">

            <a href="">Certificado.pdf</a>
            <a class="ms-4 h4 feather icon-eye"></a>
          </div>
        </div>
      </div>
      <div class="row mt-3 text-center">
        <div class="col-md-5 col-sm-12 mt-3 text-center ms-3">

        </div>
        <div class="col-md-5 col-sm-12 d-flex justify-content-center ms-4">

            <a href="">Comprobante1.pdf</a>
            <a class="ms-4 h4 feather icon-eye"></a>
          </div>
        </div>
      </div>
      <div class="row mt-3 text-center">
        <div class="col-md-5 col-sm-12 mt-3 ms-3">
        </div>
        <div class="col-md-5 col-sm-12 d-flex justify-content-center ms-4">

            <a href="">Comprobante2.pdf</a>
            <a class="ms-4 h4 feather icon-eye"></a>
          </div>
        </div>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-2 col-sm-12  mt-4">
        <button class="btn btn-primary style w-100 h-100">Asignar</button>
      </div>
      <div class="col-md-2 col-sm-12  mt-4">
        <button class="btn btn-primary style w-100 h-100">Cancelar</button>
      </div>
    </div>

 </div>
