
<h3 class="colorTextPrimari" >Datos Personales</h3><br>

<div class="row">

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="rut" class="form-label colorTextPrimari">RUT</label>
    <input
    class="form-control"
    id="rut"
    type="text"
    [readOnly]="true"
    [value]="originalData['rut']"
    >
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="name" class="form-label">Nombres</label>
    <div class="row">
      <div class="col">
        <input
        class="form-control"
        type="text"
        id="name"
        [readOnly]="true"
        [value]="originalData['names']"
        >
        <input
        *ngIf=" originalData['names'] !== modifiedData['names'] "
        class="form-control"
        type="text"
        id="name"
        [readOnly]="true"
        [value]="modifiedData['names']"
        [ngClass]="{'text-success ': modifiedData.approve === true, 'text-danger ': modifiedData.approve === false, 'text-warning ': modifiedData.approve === null }"
        >
      </div>
      <div
      class="col d-flex justify-content-start align-items-center m-0 p-0"
      *ngIf=" originalData['names'] !== modifiedData['names']"
      >
        <i class="mdi mdi-alert-circle-outline text-warning fs-1" *ngIf="modifiedData.approve === null"></i>
        <i class="mdi mdi-check-circle-outline text-success fs-1" *ngIf="modifiedData.approve === true"></i>
        <i class="mdi mdi-close-circle-outline text-danger fs-1" *ngIf="modifiedData.approve === false"></i>
      </div>
    </div>

  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="lastNames" class="form-label ">Apellidos</label>
    <div class="row">

      </div>
      <div

        <i class="mdi mdi-alert-circle-outline text-warning fs-1" *ngIf="modifiedData.approve === null"></i>
        <i class="mdi mdi-check-circle-outline text-success fs-1" *ngIf="modifiedData.approve === true"></i>
        <i class="mdi mdi-close-circle-outline text-danger fs-1" *ngIf="modifiedData.approve === false"></i>
      </div>
    </div>

  </div>

<!-- <pre>
  {{originalData | json}}

</pre> -->


<div class="row mt-3">
  <div class="col d-flex justify-content-start align-items-center ">
        <p >Modificado por:</p>
  </div>
  <div class="col d-flex justify-content-end ">
    <div class="m-0 p-0">
      <button type="button" class=" btn btn-primary me-2 mb-2 mb-md-0 style" (click)="approveChanges( $event )" [disabled]="modifiedData.approve === true ">Aprobar</button>
      <button type="button" class=" btn btn-outline-primary me-2 mb-2 mb-md-0 style" (click)="rejectChanges( $event )" [disabled]="modifiedData.approve === false">Rechazar</button>
      <button type="button" class=" btn btn-outline-primary me-2 mb-2 mb-md-0 style" (click)="updateChanges( $event )" *ngIf="modifiedData.approve !== null">Confirmar</button>
      <a href="#" (click)="edit($event)" *ngIf="authorizedEdit" >Editar</a>
    </div>
  </div>
</div>
