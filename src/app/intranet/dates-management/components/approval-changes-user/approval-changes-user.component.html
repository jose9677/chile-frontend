
<h3 class="colorTextPrimari" >Datos Personales</h3><br>

<div class="row">

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="rut" class="form-label colorTextPrimari">RUT</label>
    <input
    class="form-control"
    id="rut"
    type="text"
    [readOnly]="true"
    [value]="originalData[0]['rut']"
    >
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="name" class="form-label">Nombres</label>
    <div>
      <input
      class="form-control"
      type="text"
      id="name"
      [readOnly]="true"
      [value]="originalData[0]['names']"
      >
      <input
      class="form-control"
      type="text"
      id="name"
      [readOnly]="true"
      [value]="modifiedData[0]['names']"
      >
    </div>

  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="lastNames" class="form-label ">Apellidos</label>
    <input
    type="text"
    class="form-control"
    id="lastNames"
    [readOnly]="true"
    [value]="originalData[0]['lastname']"
    >
    <input
    type="text"
    class="form-control"
    id="lastNames"
    [readOnly]="true"
    [value]="modifiedData[0]['lastname']"
    >
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="gender" class="form-label">Sexo</label>
    <input
    type="text"
    class="form-control"
    id="lastNames"
    [readOnly]="true"
    [value]="originalData[0]['id_sex']"
    >
    <input
    type="text"
    class="form-control"
    id="lastNames"
    [readOnly]="true"
    [value]="modifiedData[0]['id_sex']"
    >
    <!-- <ng-select
    class="form-control p-0"
    id="gender"
    [readonly]="true"

    >
      <ng-option *ngFor="let gender of genders" [value]="gender.id_sex">{{gender.description}}</ng-option>
    </ng-select> -->
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="datesBirth" class="form-label">Fecha de Nacimiento</label>
    <input
    class="form-control"
    type="date"
    id="datesBirth"
    [readOnly]="true"
    [value]="originalData[0]['f_nac']"
    >
    <input
    class="form-control"
    type="date"
    id="datesBirth"
    [readOnly]="true"
    [value]="modifiedData[0]['f_nac']"
    >
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="email" class="form-label">Correo Electrónico</label>
    <input
    type="email"
    class="form-control"
    id="email"
    [readOnly]="true"
    [value]="originalData[0]['email']"
    >
    <input
    type="email"
    class="form-control"
    id="email"
    [readOnly]="true"
    [value]="modifiedData[0]['email']"
    >
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="landLine" class="form-label">Teléfono Fijo</label>
    <input
    type="tel"
    class="form-control"
    id="landLine"
    [readOnly]="true"
    [value]="'+56 '+originalData[0]['landline']"
    >
    <input
    type="tel"
    class="form-control"
    id="landLine"
    [readOnly]="true"
    [value]="'+56 '+modifiedData[0]['landline']"
    >
  </div>

  <div class="col-md-4 mb-3" [ngClass]="{'disabled': true}">
    <label for="mobilePhone" class="form-label">Teléfono Móvil</label>
    <input
    type="text"
    class="form-control"
    id="mobilePhone"
    [readOnly]="true"
    [value]="'+56 '+originalData[0]['mobile_phone']"
    >
    <input
    type="text"
    class="form-control"
    id="mobilePhone"
    [readOnly]="true"
    [value]="'+56 '+originalData[0]['mobile_phone']"
    >
  </div>
</div>
<!-- <pre>
  {{originalData | json}}
  {{modifiedData | json}}
</pre> -->


<div class="d-flex justify-content-end mt-3">
  <div class="m-0 p-0">
    <button type="button" class=" btn btn-primary me-2 mb-2 mb-md-0 style">Aprobar</button>
    <button type="button" class=" btn btn-outline-primary me-2 mb-2 mb-md-0 style">Rechazar</button>
    <a href="#" (click)="edit($event)" *ngIf="authorizedEdit">Editar</a>
  </div>
</div>
