
<div class="p-2">
  <div class="row d-flex justify-content-center">
    <div class="row px-4 d-flex justify-content-center">
      <div class="col-md-4 col-sm-6 text-center ">
        <img class="card-img-top" [src]="image" alt="">
      </div>
    </div>
  </div>
  <div class="modal-body">
    <div class="row.">
      <h2 class="text-muted fw-normal text-center titles "><strong>Asistente social</strong></h2>
    </div>
    <div class="row d-flex justify-content-evenly" >
      <div class="col-md-4 col-sm-12 text-center">
        <label for="Rut" class="form-label colorTextPrimari">Rut</label>
        <input
        type="text"
        class="form-control text-center"
        id="Rut"
        value={{dataVisitor[0]?.rut}}
        disabled>
      </div>
    </div>
    <div class="row d-flex justify-content-evenly" >
      <div class="col-md-4 col-sm-12 text-center">
        <label for="name" class="form-label colorTextPrimari">Nombres</label>
        <input
        type="text"
        class="form-control text-center"
        id="name"
        value={{dataVisitor[0]?.names}}
        disabled>
      </div>
      <div class="col-md-4 col-sm-12 text-center">
        <label for="lastName" class="form-label colorTextPrimari">Apellidos</label>
        <input
        type="text"
        class="form-control text-center"
        id="lastName"
        value={{dataVisitor[0]?.lastname}}
        disabled>
      </div>
    </div>
  </div>
  <div class="position-relative text-center">
    <button (click)="modal.close()" class="mt-1 me-2 mb-2 mb-md-0 btn btn-outline-primary style-outline">Cerrar</button>
  </div>
</div>
