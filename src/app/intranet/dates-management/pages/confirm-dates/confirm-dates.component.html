<div class="card">
  <form class="forms-sample container pb-5 px-5">
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Datos de la Solicitud</h3><br>
      <div class="row mt-3">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Número de Solicitud</label>
          <input type="text" value="14.356" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Fecha de Solicitud</label>
          <input type="date" value="2020-07-31" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Estatus</label>
          <input type="text" value="Por Asignar" disabled class="form-control">
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Solicitante</label>
          <input type="text" value="Pedro Perez" disabled class="form-control">
        </div>
        <div class="col-md-8 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Dirección</label>
          <textarea wrap="soft" style="overflow:hidden; resize:none;" value="" disabled class="form-control">Calle de ejemplo, Nro. 1234, Casa Doña Carmen</textarea>
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Asistente Social</label>
          <select class="form-control" disabled>
            <option value="">Pedro Perez</option>
          </select>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Fecha de Visita</label>
          <input type="text" value="31/10/2022" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Hora de Visita</label>
          <input type="text" value="3:00 pm" disabled class="form-control">
        </div>
      </div>
    </div>
    <div class="flex-row pt-4">
      <div class="row">
        <div class="col-3">
          <button type="submit" class=" w-100 btn btn-primary me-2 mb-2 mb-md-0 style" (click)="modalConfimarCita();$event.preventDefault()">Confirmar Cita</button>
        </div>
        <div class="col-3">
          <button type="submit" class="w-100 h-100 btn btn-outline-primary style-outline me-2 mb-2 mb-md-0 style" (click)="modalReprogramarCita();$event.preventDefault()">Reprogramar</button>
        </div>
      </div>
    </div>
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Documentos</h3><br>
    </div>
    <div class="row mt-3 justify-content-center">
      <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-md-6 col-sm-12">
              <label for="" class="form-label colorTextPrimari ">Fonasa</label>
            </div>
            <div class="col-md-6">
             <input type="text" name="" id="" class="form-control" value="Tipo A" disabled>
            </div>
          </div>
      </div>
      <div class="col-md-4 col-sm-12 text-center d-flex align-items-center">
        <a href="">Certificado.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
      </div>
    </div>
    <div class="row mt-3 justify-content-center">
      <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-md-6 col-sm-12">
              <label for="" class="form-label colorTextPrimari ">Isapre</label>
            </div>
            <div class="col-md-6">
              <input type="text" name="" id="" class="form-control" value="No Posee" disabled>
            </div>
          </div>
      </div>
      <div class="col-md-4 col-sm-12 text-center d-flex align-items-center">
        <a href="">Certificado.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
      </div>
    </div>
    <div class="row mt-3 justify-content-center">
      <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-md-6 col-sm-12">
              <label for="" class="form-label colorTextPrimari ">Recibo de Servicio</label>
            </div>
            <div class="col-md-6">
              <input type="text" name="" id="" class="form-control" value="ENEL" disabled>
            </div>
          </div>
      </div>
      <div class="col-md-4 col-sm-12 text-center d-flex align-items-center">
        <a href="">Recibo.jpeg<i class="ms-5 h4 feather icon-eye"></i></a>
      </div>
    </div>
    <br>
    <div class="row mt-3 justify-content-center">
        <div>
          <a href="" class=" d-flex align-items-center fs-4"><i class="ms-5 mdi mdi-file-pdf-box " style="font-size: 50px;"></i><strong> Ver Credencial</strong></a>
        </div>
    </div>
    <div class="d-flex flex-row justify-content-evenly pt-4">
      <div>
        <button type="submit" class=" btn btn-primary me-2 mb-2 mb-md-0 style">Regresar</button>
      </div>
    </div>
  </form>
 </div>
