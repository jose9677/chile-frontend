<div class="card">
  <form class="forms-sample container pb-5 px-5">
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Datos de la Solicitud</h3><br>
      <div class="row mt-3">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Número de Solicitud</label>
          <input type="text" value={{idRequest}} disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Fecha de Solicitud</label>
          <input type="text" value={{unassignedRequest[0]?.request_date}} disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Estatus</label>
          <input type="text" value={{unassignedRequest[0]?.status}} disabled class="form-control">
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Solicitante</label>
          <input type="text" value={{unassignedRequest[0]?.fullNameUser}} disabled class="form-control">
        </div>
        <div class="col-md-8 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Dirección</label>
          <textarea wrap="soft" style="overflow:hidden; resize:none;" value={{unassignedRequest[0]?.fullDirection}} disabled class="form-control"></textarea>
        </div>
      </div>
      <div class="row mt-4 ">
        <div class="row col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari col-md-12">Asistente Social</label>
          <input
          type="text"
          class="form-control col"
          value = {{unassignedRequest[0]?.fullName}}
          disabled>
          <a class="col-3 mt-1" (click)="visitador() ">
            <i class="h4 feather icon-eye"></i>
          </a>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Fecha de Visita</label>
          <input type="text" value={{unassignedRequest[0]?.request_date}} disabled class="form-control">
        </div>
      </div>
    </div>
    <div class="flex-row pt-4">
      <div class="row">
        <div class="col-3">
          <button type="submit" class=" w-100 btn btn-primary me-2 mb-2 mb-md-0 style" (click)="confirmDate(idRequest)" [disabled]="(unassignedRequest[0]?.id_status == 4) || (unassignedRequest[0]?.id_status == 5)">Confirmar Cita</button>
        </div>
        <div class="col-3">
          <button type="submit" class="w-100 h-100 btn btn-outline-primary style-outline me-2 mb-2 mb-md-0 style" (click)="reasignDate(idRequest)" [disabled]="(unassignedRequest[0]?.id_status == 4) || (unassignedRequest[0]?.id_status == 5)">Reprogramar</button>
        </div>
      </div>
    </div>
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Documentos</h3><br>
    </div>
    <div class="row mt-3 justify-content-center">
      <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-md-6 col-sm-12">
              <label for="" class="form-label colorTextPrimari ">Certificado de Previsión</label>
            </div>
            <div class="col-md-6">
             <input type="text" name="" id="" class="form-control" value={{unassignedRequest[0]?.fullPeventionData}} disabled>
            </div>
          </div>
      </div>
      <div class="col-md-4 col-sm-12 text-center d-flex align-items-center">
        <a href={{unassignedRequest[0]?.doc_srv_path}} target="_blank">{{unassignedRequest[0]?.document_path}}<i class="ms-4 h4 feather icon-eye"></i></a>
      </div>
    </div>
    <div class="row mt-3 justify-content-center">
      <div class="col-md-6 col-sm-12">
          <div class="row">
            <div class="col-md-6 col-sm-12">
              <label for="" class="form-label colorTextPrimari ">Comprobante de Domicilio</label>
            </div>
          </div>
      </div>
      <div class="col-md-4 col-sm-12 text-center d-flex align-items-center">
        <a href={{unassignedRequest[1]?.doc_srv_path}} target="_blank">{{unassignedRequest[1]?.document_path}}<i class="ms-5 h4 feather icon-eye"></i></a>
      </div>
    </div>
    <br>
    <div class="row mt-3 justify-content-center">
        <div>
          <a href="" class=" d-flex align-items-center fs-4"><i class="ms-5 mdi mdi-file-pdf-box " style="font-size: 50px;"></i><strong> Ver Credencial</strong></a>
        </div>
    </div>
    <div class="d-flex flex-row justify-content-evenly pt-4">
      <div>
        <button type="submit" class=" btn btn-primary me-2 mb-2 mb-md-0 style" (click)="return()">Regresar</button>
      </div>
    </div>
  </form>
 </div>
