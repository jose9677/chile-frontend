<div class="card">
<form class="forms-sample container pb-5 px-5" [formGroup]="formProgramVisitDate" (ngSubmit)="programVisitDate()">
  <div class="row mt-5 justify-content-center">
    <h3 class="colorTextPrimari">Datos de la Solicitud</h3><br>
    <div class="row mt-3">
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari">Número de Solicitud</label>
        <input type="text" value={{idRequest}} disabled class="form-control">
      </div>
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari">Fecha de Solicitud</label>
        <input type="datetime-local" value={{dataRequest[0]?.request_date}} disabled class="form-control">
      </div>
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari">Estatus</label>
        <input type="text" value= {{dataRequest[0]?.status}} disabled class="form-control">
      </div>
    </div>
    <div class="row mt-3 ">
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Solicitante</label>
        <input type="text" value={{dataRequest[0]?.fullNameUser}} disabled class="form-control">
      </div>
      <div class="col-md-8 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Dirección</label>
        <textarea wrap="soft" style="overflow:hidden; resize:none;" value={{dataRequest[0]?.fullDirection}} disabled class="form-control"></textarea>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">RUT</label>
        <input type="text" value={{dataRequest[0]?.rut}} disabled class="form-control">
      </div>
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Teléfono Fijo</label>
        <input type="text" value="+56 {{dataRequest[0]?.landline}}" disabled class="form-control">
      </div>
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Teléfono Móvil</label>
        <input type="text" value="+56 {{dataRequest[0]?.mobile_phone}}" disabled class="form-control">
      </div>
    </div>
    <div class="row mt-3 ">
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Asistente Social</label>
        <input type="text" value= {{dataRequest[0]?.fullName}} disabled class="form-control">
      </div>
      <div class="col-md-4 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Fecha y Hora de Visita</label>
        <input
        type="datetime-local"
        class="form-control"
        formControlName="dateVisit"
        value={{dataRequest[0]?.visit_date}}
        [readOnly]="dataRequest[0]?.id_status == 3"
        [ngClass]="{'is-invalid': (formProgramVisitDate.controls.dateVisit.touched && formProgramVisitDate.controls.dateVisit.errors && dataRequest[0]?.id_status != 3 ) || (isFormSubmitted && formProgramVisitDate.controls.dateVisit.errors && dataRequest[0]?.id_status != 3 )}"
                    >
                    <div *ngIf="(formProgramVisitDate.controls.dateVisit.touched && formProgramVisitDate.controls.dateVisit.errors?.required && dataRequest[0]?.id_status != 3 ) || ( isFormSubmitted && formProgramVisitDate.controls.dateVisit.errors?.required && dataRequest[0]?.id_status != 3 )" class="invalid-feedback">Campo Requerido</div>
                    <div *ngIf=" dataRequest[0]?.id_status == 3 " class="">“No es posible modificar la fecha u hora de esta cita a menos que el vecino solicite una reprogramación”</div>

      </div>
    </div>
  </div>
  <div class="row mt-5 justify-content-center">
    <h3 class="colorTextPrimari">Documentos</h3><br>
    <div class="row mt-3">
      <div class="col-md-3 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Certificado de Previsión</label>
      </div>
      <div class="col-md-3 col-sm-12 ms-6">
        <input type="text" value= {{dataRequest[0]?.fullPeventionData}} disabled class="form-control">
      </div>
      <div class="col-md-4 col-sm-12 ms-4">
        <a href="">Certificado.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-6 col-sm-12">
        <label for="" class="form-label colorTextPrimari ">Comprobante de Domicilio</label>
      </div>
      <div class="col-md-6 col-sm-12">
        <div class="col-md-12">
          <a href="">Comprobante1.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
        </div>
        <div class="col-md-12">
          <a href="">Comprobante2.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
        </div>
      </div>
    </div>
  </div>
  <br>
  <div class="d-flex flex-row justify-content-evenly pt-4">
    <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0 style" [disabled]="dataRequest[0]?.id_status == 3 || (isFormSubmitted && formProgramVisitDate.controls.dateVisit.errors )">Asignar Cita</button>
    <button type="button" class="btn btn-outline-primary mb-2 mb-md-0 style-outline" routerLink="/">Cancelar</button>
  </div>
</form>
</div>
