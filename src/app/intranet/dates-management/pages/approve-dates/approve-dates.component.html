
 <div class="card">
  <form class="forms-sample container pb-5 px-5" [formGroup]="formApprove" >
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Datos de la Solicitud</h3><br>
      <div class="row mt-3">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Número de Solicitud</label>
          <input type="text" value={{idRequest}} disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Fecha de Solicitud</label>
          <input type="datetime-local" value={{dataRequest[0]?.request_date}} disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Estatus</label>
          <input type="text" value={{dataRequest[0]?.status}} disabled class="form-control">
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Solicitante</label>
          <input type="text" value={{dataRequest[0]?.fullNameUser}} disabled class="form-control">
        </div>
        <div class="col-md-8 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Dirección</label>
          <textarea wrap="soft" style="overflow:hidden; resize:none;" value={{dataRequest[0]?.fullDirection}} disabled class="form-control"></textarea>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">RUT</label>
          <input type="text" value={{dataRequest[0]?.rut}} disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Teléfono Fijo</label>
          <input type="text" value="+56 {{dataRequest[0]?.landline}}" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Teléfono Móvil</label>
          <input type="text" value="+56 {{dataRequest[0]?.mobile_phone}}" disabled class="form-control">
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Asistente Social</label>
          <select class="form-control" disabled>
            <option value="">{{dataRequest[0]?.fullName}}</option>
          </select>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Fecha de Visita</label>
          <input type="datetime-local" value={{dataRequest[0]?.visit_date}} disabled class="form-control">
        </div>
      </div>
    </div>
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Documentos</h3><br>
      <div class="row mt-3 justify-content-start">
        <div class="col-md-3 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Tipo de Previsión</label>
        </div>
        <div class="col-md-3 col-sm-12 ms-6">
          <input type="text" value={{dataRequest[0]?.fullPeventionData}} disabled class="form-control">
        </div>
        <div class="col-sm-12 text-center d-flex align-items-center justify-content-start" *ngFor=" let document of documentsPre">
          <a href={{document?.doc_srv_path}} target="_blank">{{document?.document_path}}<i class="ms-4 h4 feather icon-eye"></i></a>
        </div>
      </div>
      <div class="row mt-3 justify-content-start">
        <div class="col-md-6 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Comprobante de Domicilio</label>
        </div>
          <div class="col-sm-12 text-center d-flex align-items-center justify-content-start" *ngFor=" let document of documentsDom">
            <a href={{document?.doc_srv_path}} target="_blank">{{document?.document_path}}<i class="ms-4 h4 feather icon-eye"></i></a>
          </div>
      </div>
    </div>
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Formulario de Aprobación</h3>
      <div class="row mt-3">
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿Solicitante en el Domicilio?</label>
            <div class="col-sm-3">
              <select
              class="form-select form-control"
              formControlName="applicantAtResidence"
              [ngClass]="{'is-invalid': (formApprove.controls.applicantAtResidence.touched && formApprove.controls.applicantAtResidence.errors?.required) || (isFormSubmitted && formApprove.controls.applicantAtResidence.errors)}">

                <option value=""></option>
                <option value="true">Si</option>
                <option value="false">No</option>
              </select>
                <div *ngIf="(formApprove.controls.applicantAtResidence.touched && formApprove.controls.applicantAtResidence.errors?.required) || (isFormSubmitted && formApprove.controls.applicantAtResidence.errors)" class="invalid-feedback">Campo Requerido</div>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿Certificado de Previsión Válido?</label>
            <div class="col-sm-3">
              <select
              class="form-select form-control"
              formControlName="validPreventionCertificate"
              [ngClass]="{'is-invalid': (formApprove.controls.validPreventionCertificate.touched && formApprove.controls.validPreventionCertificate.errors?.required) || (isFormSubmitted && formApprove.controls.validPreventionCertificate.errors)}">

                <option value=""></option>
                <option value="true">Si</option>
                <option value="false">No</option>
              </select>
                <div *ngIf="(formApprove.controls.validPreventionCertificate.touched && formApprove.controls.validPreventionCertificate.errors?.required) || (isFormSubmitted && formApprove.controls.validPreventionCertificate.errors)" class="invalid-feedback">Campo Requerido</div>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿Comprobante de Domicilio Válido?</label>
            <div class="col-sm-3">
              <select
              class="form-select form-control"
              formControlName="validProofOfAddress"
              [ngClass]="{'is-invalid': (formApprove.controls.validProofOfAddress.touched && formApprove.controls.validProofOfAddress.errors?.required) || (isFormSubmitted && formApprove.controls.validProofOfAddress.errors)}">

                <option value=""></option>
                <option value="true">Si</option>
                <option value="false">No</option>
              </select>
                <div *ngIf="(formApprove.controls.validProofOfAddress.touched && formApprove.controls.validProofOfAddress.errors?.required) || (isFormSubmitted && formApprove.controls.validProofOfAddress.errors)" class="invalid-feedback">Campo Requerido</div>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿RUT Coincide?</label>
            <div class="col-sm-3">
              <select
              class="form-select form-control"
              formControlName="DoesRUTMatch"
              value="true"
              [ngClass]="{'is-invalid': (formApprove.controls.DoesRUTMatch.touched && formApprove.controls.DoesRUTMatch.errors?.required) || (isFormSubmitted && formApprove.controls.DoesRUTMatch.errors)}">

                <option value=""></option>
                <option value="true">Si</option>
                <option value="false">No</option>
              </select>
                <div *ngIf="(formApprove.controls.DoesRUTMatch.touched && formApprove.controls.DoesRUTMatch.errors?.required) || (isFormSubmitted && formApprove.controls.DoesRUTMatch.errors)" class="invalid-feedback">Campo Requerido</div>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-12 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-3 col-form-label">Observaciones/Comentarios</label>
            <div class="col-sm-7">
              <textarea
              class="form-control"
              style="resize:none;"
              formControlName="Observations"
              [ngClass]="{'is-invalid': (formApprove.controls.Observations.touched && formApprove.controls.Observations.errors?.required) || (isFormSubmitted && formApprove.controls.Observations.errors)}">

              ></textarea>
              <div *ngIf="(formApprove.controls.Observations.touched && formApprove.controls.Observations.errors?.required) || (isFormSubmitted && formApprove.controls.Observations.errors)" class="invalid-feedback">Campo Requerido</div>

            </div>
          </div>
        </div>
      </div>
    </div>
    <br>
    <div class="row justify-content-center">

      <div class="col-md-2 col-sm-12" *ngIf="formApprove.valid && ((formApprove.valid && formApprove.value.applicantAtResidence == 'true') &&  ( formApprove.valid && formApprove.value.validPreventionCertificate == 'true') && (formApprove.valid && formApprove.value.validProofOfAddress == 'true') && (formApprove.valid && formApprove.value.DoesRUTMatch == 'true' )); else decline">

        <button type="submit" class="btn btn-primary style w-100 h-100" (click)="approve( idRequest, $event)"> Aprobar </button>

      </div>

      <ng-template #decline>

        <div class="col-md-2 col-sm-12">
           <button type="button" class="btn btn-outline-primary style-outline w-100 h-100" (click)="deny(idRequest, $event)"> Rechazar </button>
        </div>

      </ng-template>

      <div class="col-md-2 col-sm-12">
        <button class="btn btn-primary style w-100 h-100" type="button" (click)="return()">Cancelar</button>
      </div>
    </div>
  </form>
 </div>
