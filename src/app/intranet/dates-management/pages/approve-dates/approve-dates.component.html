<div class="row h3" style="background-color:var(--backgroundColo) ;">
  <p class="p-3 ms-3 mb-2 fw-bolder" style="color:var(--ColortextWhite) ;">
    Aprobar Solicitud
  </p>
</div>
 <div class="card">
  <form class="forms-sample container pb-5 px-5">
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Datos de la Solicitud</h3><br>
      <div class="row mt-3">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Número de Solicitud</label>
          <input type="text" value="14.356" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Fecha de Solicitud</label>
          <input type="date" value="2020-07-31" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Estatus</label>
          <input type="text" value="Por Asignar" disabled class="form-control">
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Solicitante</label>
          <input type="text" value="Pedro Perez" disabled class="form-control">
        </div>
        <div class="col-md-8 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Dirección</label>
          <textarea wrap="soft" style="overflow:hidden; resize:none;" value="" disabled class="form-control">Calle de ejemplo, Nro. 1234, Casa Doña Carmen</textarea>
        </div>
      </div>
      <div class="row mt-3 ">
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari">Asistente Social</label>
          <select class="form-control" disabled>
            <option value="">Pedro Perez</option>
          </select>
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Fecha de Visita</label>
          <input type="text" value="31/10/2022" disabled class="form-control">
        </div>
        <div class="col-md-4 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Hora de Visita</label>
          <input type="text" value="3:00 pm" disabled class="form-control">
        </div>
      </div>
    </div>
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Documentos</h3><br>
      <div class="row mt-3">
        <div class="col-md-6 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Comprobante de Prevención</label>
        </div>
        <div class="col-md-4 col-sm-12">
          <a href="">Comprobante1.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-6 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Comprobante de Domicilio</label>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="col-md-12">
            <a href="">Comprobante1.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
          </div>
          <div class="col-md-12">
            <a href="">Comprobante2.pdf <i class="ms-4 h4 feather icon-eye"></i></a>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-5 justify-content-center">
      <h3 class="colorTextPrimari">Formulario de Aprobación</h3>
      <div class="row mt-3">
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿Solicitante en el Domicilio?</label>
            <div class="col-sm-3">
              <select class="form-select form-control">
                <option value="">Si</option>
                <option value="">No</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿Certificado de Prevención Válido?</label>
            <div class="col-sm-3">
              <select class="form-select form-control">
                <option value="">Si</option>
                <option value="">No</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-8 col-form-label">¿Comprobante de Domicilio Válido?</label>
            <div class="col-sm-3">
              <select class="form-select form-control">
                <option value="">Si</option>
                <option value="">No</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-12 col-sm-12">
          <div class="row mb-3">
            <label for="" class="col-sm-3 col-form-label">Observaciones/Comentarios</label>
            <div class="col-sm-7">
              <textarea class="form-control"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
    <br>
    <div class="row justify-content-center">
      <div class="col-md-2 col-sm-12">
       <button class="btn btn-primary style w-100 h-100" (click)="$event.preventDefault();openGenerateCredential()">Aprobar</button> <!--ojo el event.preventDefault() evita que el formulario recargue la pagina -->
      </div>
      <div class="col-md-2 col-sm-12">
        <button class="btn btn-outline-primary style-outline w-100 h-100" (click)=" $event.preventDefault(); openRejectRequestComponent()">Rechazar</button>
      </div>
      <div class="col-md-2 col-sm-12">
        <button class="btn btn-primary style w-100 h-100">Cancelar</button>
      </div>
    </div>
  </form>
 </div>
