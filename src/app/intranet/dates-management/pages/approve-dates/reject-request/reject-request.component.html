<div class="p-3">
  <h5 class="colorTextPrimari text-center mt-3"><strong>Rechazar Solicitud</strong></h5>
  <p class="p-4" style=" text-align: justify;">¿Está seguro que desea rechazar la solicitud? Recuerde complementar el motivo de rechazo de la solicitud llenando el campo observaciones/comentarios</p>
  <div class="position-relative text-center">
    <button class="mt-4 me-2 mb-2 mb-md-0 btn btn-outline-primary style-outline" (click)="confirmDeny($event)" >Confirmar</button>
    <button (click)="modalService.dismiss()" class="mt-4 btn btn-primary me-2 mb-2 mb-md-0 style">Regresar</button>
  </div>
</div>
