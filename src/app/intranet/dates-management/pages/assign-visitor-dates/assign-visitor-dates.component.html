<div class="p-3">
  <h5 class="colorTextPrimari text-center mt-3"><strong>Asignar Solicitud</strong></h5>
  <p class="p-4" style=" text-align: justify;">Seleccione el visitador encargado de atender la(s) solicitud(es) seleccionada(s)</p>
  <form class="forms-sample" [formGroup]="formAssignSocialAssistant" (ngSubmit)="assignSocialAssistant(formAssignSocialAssistant.value.rutSocialAssistant, $event);">
    <div class="row">
      <div class="col-md-12 mb-3 ">
        <label for="nameOfstreet" class="form-label">Seleccione un Asistente Social</label>
        <ng-select [items]="listRutSocialAssistant"
            class="form-control p-0"
            bindLabel="completeNames"
            bindValue="rut"
            placeholder="Seleccione un Asistente Social"
            [(ngModel)]="selecterutSocialAssistant"
            formControlName="rutSocialAssistant"
            [ngClass]="{'is-invalid': ((formAssignSocialAssistant.controls.rutSocialAssistant.touched && formAssignSocialAssistant.value.rutSocialAssistant === null) || (isFormSubmitted && formAssignSocialAssistant.value.rutSocialAssistant === null))}"
            >
        </ng-select>
        <div *ngIf="(formAssignSocialAssistant.controls.rutSocialAssistant.touched && formAssignSocialAssistant.value.rutSocialAssistant === null) || (isFormSubmitted && formAssignSocialAssistant.value.rutSocialAssistant === null)" class="invalid-feedback">Campo Requerido</div>
      </div>
    </div>
    <div class="position-relative text-center">
      <button (click)=" modalService.dismiss()" class="mt-4 btn btn-primary me-2 mb-2 mb-md-0 style">Asignar</button>
    </div>
  </form>
</div>
