<div class="card">
   <form class="forms-sample container mb-5">
    <div class="row mt-5">
      <div class="row justify-content-evenly">
        <div class="col-md-5 col-sm-12 text-center">
          <h3 class="colorTextPrimari">Datos Personales</h3>
        </div>
      </div>
      <div class="row mt-3 justify-content-evenly">
        <div class="col-md-5 col-sm-12">
          <label for="Rut" class="form-label colorTextPrimari">RUT</label>
          <input id="Rut" type="text" class="form-control" placeholder="Rut">
        </div>
        <div class="col-md-5 col-sm-12">
        </div>
      </div>
      <div class="row mt-3 justify-content-evenly">
        <div class="col-md-5 col-sm-12">
          <label for="Nombres" class="form-label colorTextPrimari">Nombres</label>
          <input id="Nombres" type="text" class="form-control" placeholder="Nombres">
        </div>
        <div class="col-md-5 col-sm-12 ">
          <label for="Apellidos" class="form-label colorTextPrimari">Apellidos</label>
          <input id="Apellidos" type="text" class="form-control" placeholder="Apellidos">
        </div>
      </div>
      <div class="row mt-3 justify-content-evenly ">
        <div class="col-md-5 col-sm-12">
          <label for="" class="form-label colorTextPrimari ">Fecha de Visita</label>
          <input type="date" class="form-control form-date">
        </div>
        <div class="col-md-5 col-sm-12 mt-2 ">
          <label for="Correo Electrónico" class="form-label colorTextPrimari">Correo Electrónico</label>
          <input id="Correo Electrónico" type="email" class="form-control" placeholder="Correo Electrónico">
        </div>
      </div>
      <div class="row mt-3 justify-content-evenly">
        <div class="col-md-5 col-sm-12 mt-2 ">
          <label for="Teléfono Fijo" class="form-label colorTextPrimari">Teléfono Fijo</label>
          <input id="Teléfono Fijo" type="text" class="form-control" placeholder="Teléfono Fijo">
        </div>
        <div class="col-md-5 col-sm-12 mt-2">
          <label for="Teléfono Movil" class="form-label colorTextPrimari">Teléfono Movil</label>
          <input id="Teléfono Movil" type="text" class="form-control" placeholder="Teléfono Movil">
        </div>
      </div>
      <div class="row mt-4 justify-content-evenly">
        <div class="col-md-5 col-sm-12">
          <h4 class="colorTextPrimari">Fotografía de Perfil</h4>
          <a href="" class="mt-2">+  Haga click aqui para agregar</a>
          <p class="col-md-12 col-sm-12 colorTextPrimari mt-1">Solo admite archivos .jpg, .jpeg y .png
           Tamaño máximo 8 Mb</p>
        </div>
        <div class="col-md-5 col-ms-12">
        </div>
      </div>
    </div>
    <div class="row mt-5">
      <h3 class="colorTextPrimari text-center">Datos de Acceso</h3><br>
      <div class="row mt-3 justify-content-evenly">
        <div class="col-md-5 col-sm-12 mt-2">
          <label for="Rol de Usuario" class="form-label colorTextPrimari">Rol de Usuario</label>
          <select id="Rol de Usuario" class="form-control form-select" placeholder="Rol de Usuario">
            <option value="">Rol Admin</option>
          </select>
        </div>
        <div class="col-md-5 col-sm-12"></div>
      </div>
    </div>
    <div class="row mt-5 justify-content-evenly">
      <div class="col-md-11 col-sm-12 p-5" >
        <p class="colorTextPrimari fs-4">Contraseña</p>
        <p class="colorTextPrimari fs-5">El usuario recibirá un correo electrónico con instrucciones para crear su contraseña de acceso.</p>
      </div>
    </div>
    <br>
    <div class="row justify-content-center">
      <div class="col-md-2 col-sm-12 mt-2">
       <button class="btn btn-primary style w-100 h-100" >Agregar</button> <!--ojo el event.preventDefault() evita que el formulario recargue la pagina -->
      </div>
      <div class="col-md-2 col-sm-12 mt-2">
        <button class="btn btn-primary style w-100 h-100">Cancelar</button>
      </div>
    </div>
  </form>
 </div>
