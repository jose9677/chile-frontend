<div class="row">
  <div class="col-md-12">
      <div class="card header p-3 mb-3">
          <h2>Vecinos</h2>
      </div>
  </div>
</div>

<div class="card m-0 px-5 py-5 mt-3">
  <form class="forms-sample" [formGroup]="formRutUser" (ngSubmit)="searchRut($event)">
    <div class="mb-3 mt-3">
      <h3 for="Rut" class="form-label colorTextPrimari">Ingrese el RUT del vecino</h3>


          <input
          type="text"
          class="form-control col-sm-8"
          id="Rut"
          (keyup)="correctRut()"
          formControlName = rutNumber
          placeholder="0000000-0"
          [ngClass]="{'is-invalid': (formRutUser.controls.rutNumber.touched && formRutUser.controls.rutNumber.errors) || (isFormSubmitted && formRutUser.controls.rutNumber.errors)}"
              >
              <div *ngIf="(formRutUser.controls.rutNumber.touched && formRutUser.controls.rutNumber.errors?.required) || (isFormSubmitted && formRutUser.controls.rutNumber.errors?.required)" class="invalid-feedback">Campo Requerido</div>


    </div>

    <div class="d-flex justify-content-center">
      <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0 style" [disabled]=" isFormSubmitted ">Buscar</button>
    </div>
    <!-- <a routerLink="/auth/login" (click)=" modalService.dismiss()" class="d-block mt-3 text-muted text-center">¿Ya tienes Cuenta? <span class="link" >Inicia Sesión</span></a> -->
  </form>
</div>
