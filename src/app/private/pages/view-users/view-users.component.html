<div class="row">
  <div class="col-md-12">
      <div class="card header p-3">
          <h2>usuarios</h2>
      </div>
  </div>
</div>
<br>
<div class="row">
  <div class="col-md-12">
    <div class="card stretch-card">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 col-sm-12">
            <h3 class="colorTextPrimari pb-3">Usuarios</h3>
          </div>
          <div class="col-md-6 col-sm-12 text-center h4">
            <a href="/seguridad/Crear-usuario"><i class="feather icon-plus-circle" style="color: var(--backgroundColo);"></i>Agregar Usuario</a>
          </div>
        </div>
        <div class="table-responsive">
          <!-- <div class="col-md-6 datasearch">
            <input type="text" placeholder="Buscar..." #txtSearch (keyup)="sortByService.onSearch(txtSearch.value)">
            <i class="mdi mdi-magnify"></i>
          </div> -->
          <div class="input-group col-md-4 mb-3">
            <!-- <input type="text" class="form-control" placeholder="Buscar..." #txtSearch (keyup)="sortByService.onSearch(txtSearch.value)"> -->
            <div class="input-group-append">
              <!-- <span class="input-group-text" id="basic-addon2"><i class="mdi mdi-magnify"></i></span> -->
            </div>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>rut</th>
                <th>Nombre Y Apellido</th>
                <th>Rol</th>
                <th>Estatus</th>
                <th>Opciones</th>
              </tr>
            </thead>
            <tbody>
                 <tr *ngFor="let usuario of Usuarios">
                  <td>{{usuario.rut}}</td>
                  <td>{{usuario.names}} {{usuario.lastname}}</td>
                  <td><p *ngIf="usuario.id_rol== 2">ASISTENTE SOCIAL</p>
                  <p *ngIf="usuario.id_rol== 3">SUPERVISOR</p></td>
                  <td><input *ngIf="usuario.active == true" type="button" disabled class="activo" value="Activo">
                  <input *ngIf="usuario.active == false || usuario.active == null" type="button" disabled class="desactivado" value="Desactivado">
                  </td>
                  <td><a><i class="feather icon-eye h4" title="Ver"(click)="VerUsuario(usuario.rut) "  style="color: var(--colorSecundary);"></i></a><a><i *ngIf="usuario.active == true" class="feather icon-x-circle h4 ms-1" title="Desactivar" (click)="desactivarUser(usuario.rut)" style="color: #BA153F;"></i>
                  <i *ngIf="usuario.active == false || usuario.active == null" class="feather icon-check h4 ms-1" title="Activar" (click)="activarUser(usuario.rut)" style="color:var(--colorSecundary)"></i>
                  </a> <a (click)="editar(usuario.rut) "><i class="mdi mdi-pencil h4 ms-1" title="Editar" style="color:var(--colorSecundary);"></i></a></td>
                 </tr>
                <!-- <tr >

                  <td>

                  </td>
                </tr> -->
            </tbody>
            <tfoot>
              <tr>
                <th>

                </th>
                <th>

                </th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
