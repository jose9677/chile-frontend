<div class="row">
  <div class="col-md-12">
      <div class="card header p-3">
          <h2>Roles</h2>
      </div>
  </div>
</div>
<br>
<div class="row">
  <div class="col-md-12">
    <div class="card stretch-card">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 col-sm-12">
            <h3 class="colorTextPrimari pb-3">Roles</h3>
          </div>
          <div class="col-md-6 col-sm-12 text-center h4">
            <a href="/privado/agregar-rol"><i class="feather icon-plus-circle" style="color: var(--backgroundColo);"></i>Agregar Rol</a>
          </div>
        </div>
        <div class="table-responsive">
          <!-- <div class="col-md-6 datasearch">
            <input type="text" placeholder="Buscar..." #txtSearch (keyup)="sortByService.onSearch(txtSearch.value)">
            <i class="mdi mdi-magnify"></i>
          </div> -->
          <div class="input-group col-md-4 mb-3">
            <!-- <input type="text" class="form-control" placeholder="Buscar..." #txtSearch (keyup)="sortByService.onSearch(txtSearch.value)"> -->
            <div class="input-group-append">
              <span class="input-group-text" id="basic-addon2"><i class="mdi mdi-magnify"></i></span>
            </div>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>Rol</th>
                <th>Estatus</th>
                <th>Opciones</th>
              </tr>
            </thead>
            <tbody>
                 <tr *ngFor="let rol of roles">
                   <td>{{rol.name}}</td>
                  <td><input *ngIf="rol.active == true" type="button" disabled class="activo" value="Activo">
                  <input *ngIf="rol.active == false || rol.active == null" type="button" disabled class="desactivado" value="Desactivado"></td>
                  <td><a><i class="feather icon-eye h4" title="Ver"></i></a><a><i *ngIf="rol.active == true" class="feather icon-x-circle h4 ms-1" title="Desactivar" (click)="desactivarRol(rol.id)"style="color: #BA153F;"></i>
                  <i *ngIf="rol.active == false || rol.active == null" class="feather icon-check h4 ms-1" title="Activar" (click)="activarRol(rol.id)"style="color: #0EADB0;"></i>
                  </a> <a (click)="editar(rol.id) "><i class="mdi mdi-pencil h4 ms-1" title="Editar" style="color: #0EADB0;"></i></a></td>
                 </tr>
                <!-- <tr >

                  <td>

                  </td>
                </tr> -->
            </tbody>
            <tfoot>
              <tr>
                <th>

                </th>
                <th>

                </th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
