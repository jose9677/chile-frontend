<form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="m-3">
  <div card m-0 px-5 py-5 mt-3>
    <h3 class="colorTextPrimari pb-3">Datos de Acceso</h3>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="inputPassword1" class="form-label">Contraseña</label>
        <input
        type="password"
        class="form-control"
        id="inputPassword1"
        autocomplete="current-password"
        placeholder="Ingrese una contraseña"
        formControlName="password"
        [ngClass]="{'is-invalid': ((passwordForm.controls.password.touched && passwordForm.controls.password.errors) || (isFormSubmitted && passwordForm.controls.password.errors) )}">
        <div *ngIf="(passwordForm.controls.password.touched && passwordForm.controls.password.errors?.required) || (isFormSubmitted && passwordForm.controls.password.errors?.required)" class="invalid-feedback col-md-6 mb-3">
              Campo requerido
        </div>
        <div *ngIf="(passwordForm.controls.password.touched && passwordForm.controls.password.errors?.pattern) || (isFormSubmitted && passwordForm.controls.password.errors?.pattern)" class="invalid-feedback col-md-6 mb-3">
          La contraseña no cumple con los parámetros
    </div>
      </div>
      <div class="col-md-6 mb-3 info ">
        La contraseña de contener:
        <ul>
         <li>Al menos una letra Mayúscula</li>
         <li>Al menos una letra minúscula</li>
         <li>Al menos un número</li>
         <li>Al menos 8 dígitos de longitud</li>
        </ul>
     </div>
      <div class="col-md-6 mb-3">
        <label for="InputPassword2" class="form-label">Confirmar Contraseña</label>
        <input
        type="password"
        class="form-control"
        id="InputPassword2"
        autocomplete="current-password"
        placeholder="Repita la contraseña"
        formControlName="rePassword"
        [ngClass]="{'is-invalid': ((passwordForm.controls.rePassword.touched && passwordForm.controls.rePassword.errors?.equalTo)|| (isFormSubmitted && passwordForm.controls.rePassword.errors?.equalTo))}">
          <div *ngIf="(passwordForm.controls.rePassword.touched && passwordForm.controls.rePassword.errors?.equalTo) || (isFormSubmitted && passwordForm.controls.rePassword.errors?.equalTo)" class="invalid-feedback">La contraseña no coincide</div>
      </div>
    </div>
    <div class="d-flex justify-content-end mt-3" >
      <!-- <a href="#" (click)="editPersonalData($event)" *ngIf="!(isEditingPersonalData | async)">Editar</a> -->
      <div>
        <!-- <button type="button" class=" btn btn-primary me-2 mb-2 mb-md-0 style" (click)="updatePersonalData($event)">Actualizar</button> -->
        <button type="submit" class=" btn btn-primary me-2 mb-2 mb-md-0 style">Cambiar contraseña</button>
        <button type="button" class=" btn btn-outline-primary me-2 mb-2 mb-md-0 style" (click)="cancel($event)" >Cancelar</button>
      </div>
    </div>
  </div>
</form>
