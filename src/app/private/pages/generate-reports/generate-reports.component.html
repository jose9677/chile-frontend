<div class="row">
  <div class="col-md-12">
      <div class="card header p-3">
          <h2>Reportes</h2>
      </div>
  </div>
</div>
<br>
<div class="card">

  <div class="container p-5">

    <div class="row justify-content-left mb-3">
      <h3 class="colorTextPrimari">Reporte General de Usuarios - Solicitudes</h3><br><br>
      <h5 class="colorTextPrimari">Genera el reporte actualizado al día de hoy de usuarios y solicitudes registradas en el sistema</h5><br><br>
    </div>

    <div class="row justify-content-center">
      <button  class=" col-3 btn btn-primary me-2 mb-2 mb-md-0 style" type="button" (click)="downloadReport1($event)" >Generar Reporte General</button>
    </div>
  </div>


</div>
<br>
<div class="card">

  <div class="container p-5">

    <div class="row justify-content-start mb-3">
      <h3 class="colorTextPrimari">Reporte Integramédica</h3><br><br>
      <h5 class="colorTextPrimari">Genera el reporte actualizado al día de hoy de usuarios registrados en el sistema cuya solicitud ha sido aprobada</h5><br><br>
    </div>

    <div class="row justify-content-center">
      <button  class=" col-3 btn btn-primary me-2 mb-2 mb-md-0 style" type="button" (click)="downloadReport2($event)" >Generar Reporte Integramédica</button>
    </div>
  </div>


</div>
