<div class="row col-md-12 col-xl-8 mx-0 auth-page">
  <div class="col-md-5 col-xl-6 mx-auto ">
    <div class="card" style="border-radius: .9rem;">
      <div class="row d-flex justify-content-center">
        <div class="col-md-11 ps-md-0 ">
          <div class="auth-form-wrapper px-4 py-5 ">
            <img class="card-img-top px-4" src="../assets/images/login/SaludAtuAlcanceLogo.png" alt=""><br><br>
            <h2 class="text-muted fw-normal text-center titles "><strong> Contraseña de acceso </strong></h2><br>
            <p class="colorTextPrimari text-center">Por favor cree una contraseña para ser utilizada para acceder al sistema</p><br>
            <form class="forms-sample" [formGroup]="formRecoveryPassword" (ngSubmit)="recoveryPassword($event)">
              <!-- <h3 class="colorTextPrimari pb-3">Datos de Acceso</h3> -->
                <div class="mb-3">
                  <label for="inputPassword1" class="form-label colorTextPrimari">Contraseña</label>
                  <input
                  type="password"
                  class="form-control"
                  id="inputPassword1"
                  autocomplete="current-password"
                  placeholder="Ingrese una contraseña"
                  formControlName="password"
                  [ngClass]="{'is-invalid': ((formRecoveryPassword.controls.touched && formRecoveryPassword.value.password === '') || (isFormSubmitted && formRecoveryPassword.value.password === ''))}">
                  <br>  
                  <div class="mb-3 info ">
                    La contraseña de contener:
                    <ul>
                      <li>Al menos una letra Mayúscula</li>
                      <li>Al menos una letra minúscula</li>
                      <li>Al menos un número</li>
                      <li>Al menos 8 digitos de longitud</li>
                    </ul>
                  </div>
                </div>
                <div class="mb-3">
                  <label for="InputPassword2" class="form-label colorTextPrimari">Confirmar Contraseña</label>
                  <input
                  type="password"
                  class="form-control"
                  id="InputPassword2"
                  autocomplete="current-password"
                  placeholder="Repita la contraseña"
                  formControlName="rePassword"
                  [ngClass]="{'is-invalid': ((formRecoveryPassword.controls.touched && formRecoveryPassword.controls.rePassword.errors) || (isFormSubmitted && formRecoveryPassword.value.proofOfAddress1 === ''))}">
                    <div *ngIf="(formRecoveryPassword.controls.touched && formRecoveryPassword.controls.rePassword.errors) || (isFormSubmitted && formRecoveryPassword.value.rePassword === '')" class="invalid-feedback">Contraseña no Coincide</div>
                </div>


              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0 style">Continuar</button>
              </div>
              <a routerLink="/auth/login"  class="d-block mt-3 text-muted text-center"><span class="link" >Volver al Inicio de Sesión</span></a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
