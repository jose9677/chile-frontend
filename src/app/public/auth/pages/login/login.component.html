<div class="row w-100 mx-0 auth-page">
  <div class="col-md-5 col-xl-6 mx-auto ">
    <div class="card" style="border-radius: .9rem;">
      <div class="row d-flex justify-content-center">
        <div class="col-md-11 ps-md-0 ">
          <div class="auth-form-wrapper px-4 py-5 ">
            <img class="card-img-top" src="../assets/images/login/LogoLaReinaCorporacion-FondoBlanco1.png" alt="">
            <h1 class="text-muted fw-normal text-center titles "><strong> Iniciar Sesión</strong></h1>
            <form class="forms-sample">
              <div class="mb-3 mt-3">
                <label for="exampleInputEmail1" class="form-label colorTextPrimari size">Rut</label>
                <input type="text" class="form-control" id="Rud" >
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label colorTextPrimari size">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" autocomplete="current-password"  >
              </div>
              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0 style" (click)="onLoggedin($event)">Ingresar</button>
              </div>
              <a routerLink="/auth/register" class="d-block mt-3 text-muted">Not a user? Sign up</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
