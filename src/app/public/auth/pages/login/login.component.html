<div class="row col-md-12 col-xl-8 mx-0 auth-page">
  <div class="col-md-5 col-xl-6 mx-auto ">
    <div class="card" style="border-radius: .9rem;">
      <div class="row d-flex justify-content-center">
        <div class="col-md-11 ps-md-0 ">
          <div class="auth-form-wrapper px-4 py-5 ">
            <img class="card-img-top px-4" src="../assets/images/login/SaludAtuAlcanceLogo.png" alt=""><br><br>
            <h2 class="text-muted fw-normal text-center titles "><strong> Iniciar Sesión</strong></h2><br>
            <form class="forms-sample" [formGroup]="userLogin" (ngSubmit)="onLoggedin($event)">
              <div class="mb-3 mt-3">
                <label for="Rut" class="form-label colorTextPrimari">RUT</label>
                <input
                type="text"
                class="form-control"
                id="Rut"
                formControlName="rut"
                placeholder="00000000-0"
                [ngClass]="{'is-invalid': (userLogin.controls.rut.touched && userLogin.controls.rut.errors?.required) || (isFormSubmitted && userLogin.controls.rut.errors?.required)}"
                    >
                    <div *ngIf="(userLogin.controls.rut.touched && userLogin.controls.rut.errors?.required) || ( isFormSubmitted && userLogin.controls.rut.errors?.required)" class="invalid-feedback">Campo Requerido</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label colorTextPrimari">Contraseña</label>
                <input
                type="password"
                class="form-control"
                id="password"
                formControlName="password"
                placeholder="Ingrese su Contraseña"
                [ngClass]="{'is-invalid': (userLogin.controls.password.touched && userLogin.controls.password.errors?.required) || (isFormSubmitted && userLogin.controls.password.errors)}"
                    >
                    <div *ngIf="(userLogin.controls.password.touched && userLogin.controls.password.errors?.required) || (isFormSubmitted && userLogin.controls.password.errors)" class="invalid-feedback">Campo Requerido</div>

              </div>
              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0 style">Ingresar</button>
              </div>
              <a (click)="modalRecovery()" class="d-block mt-3 text-muted text-center">¿Olvidó su Contraseña?</a>
              <a class="d-block mt-3 text-muted text-center">¿No tienes Cuenta? <span class="link" (click)="modalRut()">Regístrate</span></a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
