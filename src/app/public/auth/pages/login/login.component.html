<div class="row col-md-12 col-xl-8 mx-0 auth-page">
  <div class="col-md-5 col-xl-6 mx-auto ">
    <div class="card" style="border-radius: .9rem;">
      <div class="row d-flex justify-content-center">
        <div class="col-md-11 ps-md-0 ">
          <div class="auth-form-wrapper px-4 py-5 ">
            <img class="card-img-top px-4" src="../assets/images/login/LogoLaReinaCorporacion-FondoBlanco1.png" alt=""><br><br>
            <h2 class="text-muted fw-normal text-center titles "><strong>Iniciar Sesión</strong></h2><br>
            <form class="forms-sample">
              <div class="mb-3 mt-3">
                <label for="exampleInputEmail1" class="form-label">RUT</label>
                <input type="text" class="form-control" id="Rud" placeholder="Ingrese su RUT">
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="exampleInputPassword1" autocomplete="current-password"  placeholder="Ingrese su Contraseña">
              </div>
              <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary me-2 mb-2 mb-md-0 style" (click)="onLoggedin($event)">Ingresar</button>
              </div>
              <a routerLink="/auth/forget-password" class="d-block mt-3 text-muted text-center">¿Olvidó su Contraseña?</a>
              <a routerLink="/auth/register" class="d-block mt-3 text-muted text-center">¿No tienes Cuenta? <span class="link">Regístrate</span></a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
