<ng-template #contenido let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Titulo Modal</h4>
    <button class="close" aria-label="close" (click)="modal.dismiss()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <app-login></app-login>
  </div>

  <div class="modal-footer">
    <button class="btn btn-success" type="button" (click)="modal.close()">ok</button>
  </div>
</ng-template>

<button class="btn btn-outline-primary" type="button" (click)="openModal(contenido)">lanzar</button>
